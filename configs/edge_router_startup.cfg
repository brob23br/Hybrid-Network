! ============================================================
! Summit Ridge Engineering — Edge Router (Cisco IOSv)
! GNS3 Startup Configuration
! Device: Edge-Router  |  Interfaces: gi0/0 (LAN trunk), gi0/1 (WAN)
! ============================================================

version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Edge-Router
!
boot-start-marker
boot-end-marker
!
enable secret cisco
!
no aaa new-model
!
! ─── LOOPBACK (Management) ────────────────────────────────
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
 description Management-Loopback
!
! ─── WAN INTERFACE ────────────────────────────────────────
! gi0/1 connects to GNS3 Cloud (NAT) node for internet access.
! The DHCP client address on gi0/1 becomes the NAT outside address.
interface GigabitEthernet0/1
 description WAN-to-Internet
 ip address dhcp
 ip nat outside
 no shutdown
!
! ─── LAN TRUNK TO L3 SWITCH ──────────────────────────────
! gi0/0 is the physical trunk — no IP on the parent.
interface GigabitEthernet0/0
 description LAN-trunk-to-L3-Switch
 no ip address
 no shutdown
!
! ─── SUBINTERFACE: VLAN 10 Engineering ───────────────────
interface GigabitEthernet0/0.10
 description VLAN10-Engineering-Gateway
 encapsulation dot1Q 10
 ip address 10.0.10.1 255.255.255.0
 ip nat inside
 ip access-group ACL_VLAN10_IN in
!
! ─── SUBINTERFACE: VLAN 20 Administration ────────────────
interface GigabitEthernet0/0.20
 description VLAN20-Administration-Gateway
 encapsulation dot1Q 20
 ip address 10.0.20.1 255.255.255.0
 ip nat inside
 ip access-group ACL_VLAN20_IN in
!
! ─── SUBINTERFACE: VLAN 30 Servers/Management ────────────
interface GigabitEthernet0/0.30
 description VLAN30-Servers-Mgmt-Gateway
 encapsulation dot1Q 30
 ip address 10.0.30.1 255.255.255.0
 ip nat inside
!
! ─── ROUTING ──────────────────────────────────────────────
ip routing
!
! Default route to ISP — uses DHCP-assigned next hop.
ip route 0.0.0.0 0.0.0.0 dhcp
!
! Static return route to Azure VNet via VPN tunnel.
ip route 10.1.0.0 255.255.0.0 Tunnel10
!
! ─── NAT ──────────────────────────────────────────────────
ip nat inside source list NAT_ACL interface GigabitEthernet0/1 overload
!
ip access-list standard NAT_ACL
 permit 10.0.0.0 0.255.255.255
 deny   any
!
! ─── ACLs ─────────────────────────────────────────────────
! VLAN 10 inbound ACL — applied to gi0/0.10 in
ip access-list extended ACL_VLAN10_IN
 remark Allow VLAN10 to File Server (10.0.30.10)
 permit ip 10.0.10.0 0.0.0.255 host 10.0.30.10
 remark Deny VLAN10 to VLAN20
 deny   ip 10.0.10.0 0.0.0.255 10.0.20.0 0.0.0.255
 remark Deny VLAN10 to rest of VLAN30 (DHCP server, mgmt)
 deny   ip 10.0.10.0 0.0.0.255 10.0.30.0 0.0.0.255
 remark Allow VLAN10 to internet and Azure (NAT handles it)
 permit ip 10.0.10.0 0.0.0.255 any
!
! VLAN 20 inbound ACL — applied to gi0/0.20 in
ip access-list extended ACL_VLAN20_IN
 remark Deny VLAN20 to VLAN10
 deny   ip 10.0.20.0 0.0.0.255 10.0.10.0 0.0.0.255
 remark Deny VLAN20 to VLAN30 (servers)
 deny   ip 10.0.20.0 0.0.0.255 10.0.30.0 0.0.0.255
 remark Allow VLAN20 to internet
 permit ip 10.0.20.0 0.0.0.255 any
!
! ─── VPN — IPsec/IKEv2 ────────────────────────────────────
! IKEv2 Proposal (must match Azure policy: AES-256, SHA-256, DH Group 14)
crypto ikev2 proposal AZURE-IKEv2-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy AZURE-IKEv2-POL
 proposal AZURE-IKEv2-PROP
!
! IKEv2 keyring — replace <AZURE_VPN_GW_PUBLIC_IP> and <PSK> after Terraform deploy.
crypto ikev2 keyring AZURE-KEYRING
 peer AZURE-GW
  address <AZURE_VPN_GW_PUBLIC_IP>
  pre-shared-key <PSK>
!
crypto ikev2 profile AZURE-IKEv2-PROFILE
 match identity remote address <AZURE_VPN_GW_PUBLIC_IP> 255.255.255.255
 identity local address <EDGE_ROUTER_WAN_IP>
 authentication remote pre-share
 authentication local pre-share
 keyring local AZURE-KEYRING
!
! IPsec transform set — AES-256-CBC + SHA-256 HMAC
crypto ipsec transform-set AZURE-XFORM-SET esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile AZURE-IPSEC-PROFILE
 set transform-set AZURE-XFORM-SET
 set ikev2-profile AZURE-IKEv2-PROFILE
!
! Tunnel interface for VPN to Azure
interface Tunnel10
 description IPsec-Tunnel-to-Azure
 ip address 169.254.0.1 255.255.255.0
 tunnel source GigabitEthernet0/1
 tunnel destination <AZURE_VPN_GW_PUBLIC_IP>
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile AZURE-IPSEC-PROFILE
!
! ─── LOGGING / MISC ───────────────────────────────────────
no ip domain lookup
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 password cisco
 login
 transport input telnet ssh
!
end
