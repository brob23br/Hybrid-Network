# ============================================================
# Summit Ridge Engineering — ISC DHCP Server Configuration
# Device: DHCP-Server  |  IP: 10.0.30.20 static (VLAN 30)
# Install: sudo apt-get install isc-dhcp-server
# Config:  /etc/dhcp/dhcpd.conf
# Service: sudo systemctl restart isc-dhcp-server
# ============================================================

# Global settings
default-lease-time 86400;        # 24 hours
max-lease-time 604800;           # 7 days
authoritative;
log-facility local7;

# DNS servers handed to clients
option domain-name-servers 8.8.8.8, 8.8.4.4;
option domain-name "summitridge.local";

# ─── VLAN 10 Engineering Pool ─────────────────────────────
subnet 10.0.10.0 netmask 255.255.255.0 {
  range 10.0.10.100 10.0.10.200;
  option subnet-mask 255.255.255.0;
  option routers 10.0.10.1;           # Edge router subinterface gi0/0.10
  option broadcast-address 10.0.10.255;
}

# ─── VLAN 20 Administration Pool ──────────────────────────
subnet 10.0.20.0 netmask 255.255.255.0 {
  range 10.0.20.100 10.0.20.200;
  option subnet-mask 255.255.255.0;
  option routers 10.0.20.1;           # Edge router subinterface gi0/0.20
  option broadcast-address 10.0.20.255;
}

# ─── VLAN 30 Servers/Mgmt — No DHCP pool ─────────────────
# DHCP Server (10.0.30.20) and File Server (10.0.30.10) are static.
# No DHCP pool needed for VLAN30.
subnet 10.0.30.0 netmask 255.255.255.0 {
  # Declare subnet for routing; no range issued.
}

