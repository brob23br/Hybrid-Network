! ============================================================
! Summit Ridge Engineering — L3 Core Switch (Cisco IOSvL2)
! GNS3 Startup Configuration
! Device: L3-Core-Switch
! Ports: gi0/0 = trunk to Edge-Router | gi0/1 = trunk to OVS
!        gi0/2 = access VLAN30 to DHCP Server
!        gi0/3 = access VLAN30 to File Server
! ============================================================

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname L3-Core-Switch
!
enable secret cisco
!
no aaa new-model
!
! ─── VLANs ────────────────────────────────────────────────
vlan 10
 name Engineering
!
vlan 20
 name Administration
!
vlan 30
 name Servers-Mgmt
!
! ─── INTER-VLAN SVIs (layer 3) ───────────────────────────
! These SVIs are for HSRP/redundancy in production; routing
! currently handled by edge router subinterfaces.
interface Vlan10
 description Engineering-SVI
 ip address 10.0.10.2 255.255.255.0
 no shutdown
!
interface Vlan20
 description Administration-SVI
 ip address 10.0.20.2 255.255.255.0
 no shutdown
!
interface Vlan30
 description Servers-Mgmt-SVI
 ip address 10.0.30.2 255.255.255.0
 no shutdown
!
ip routing
!
! Default route toward edge router (VLAN30 SVI as next-hop for mgmt)
ip route 0.0.0.0 0.0.0.0 10.0.30.1
!
! ─── DHCP RELAY ───────────────────────────────────────────
! Relays DHCP broadcasts from VLAN10 and VLAN20 to the DHCP server.
interface Vlan10
 ip helper-address 10.0.30.20
!
interface Vlan20
 ip helper-address 10.0.30.20
!
! ─── UPLINK TO EDGE ROUTER (gi0/0) ───────────────────────
interface GigabitEthernet0/0
 description Trunk-to-Edge-Router-gi0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
!
! ─── DOWNLINK TO OVS (gi0/1) ─────────────────────────────
interface GigabitEthernet0/1
 description Trunk-to-OVS
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
!
! ─── ACCESS PORT: DHCP SERVER (gi0/2) ────────────────────
interface GigabitEthernet0/2
 description Access-DHCP-Server-10.0.30.20
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
! ─── ACCESS PORT: FILE SERVER (gi0/3) ────────────────────
interface GigabitEthernet0/3
 description Access-File-Server-10.0.30.10
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
! ─── SPANNING TREE ────────────────────────────────────────
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
! ─── LOGGING / MISC ───────────────────────────────────────
no ip domain lookup
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 password cisco
 login
 transport input telnet ssh
!
end
